  lab_url: "https://www.vai.org/"
  location: "Grand Rapids, MI"
  phd_start: 2022-08                   # drives the "uptime" line
  tagline: "I read the epigenome for signs of aging, in progeria and in all of us."
  focus:
    - "DNA methylation"
    - "3D chromatin"
    - "HGPS / progeria"
    - "epigenetic clocks"
    - "Bayesian methods"
  stack: "R · Python · Nextflow · SLURM · torch"
  bio: |
    I'm a computational biologist in Peter Laird's lab at the Van Andel Institute.
    My thesis maps how a single mutant protein, progerin, rewires the epigenome
    in Hutchinson-Gilford Progeria Syndrome (HGPS), and how far that rewiring
    looks like normal aging. I combine DNA methylation arrays, whole-genome bisulfite
    sequencing, Hi-C, CUT&Tag, ATAC-seq, transcriptomics, proteomics and AlphaFold3
    structure prediction across mouse tissues, cell models and published datasets.

    I also build open-source tools: Bayesian region-level methylation inference
    (BREAD), a mouse epigenetic-age clock (MEAD), and interpretable deep-learning
    clocks in R {torch}.

    Before VAI I profiled Parkinson's disease brains in Sreeganga Chandra's lab
    at Yale, and as an undergraduate at Franklin & Marshall I studied a rare
    neurodevelopmental disorder in Lancaster Amish children.
  # "now" — what you're up to (shows under contact on the home page). Keep it short.
  now:
    - "Writing up my thesis on epigenetic aging in progeria"            # TODO edit
    - "First-author manuscript: progeria mouse methylome (in prep)"
    - "BREAD: Bayesian region-level DNA methylation inference in R"
