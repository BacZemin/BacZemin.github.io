# ── Research projects ───────────────────────────────────────────────────
#  kind: thesis | software | side
#  links: optional list of { label, url }
projects:
  - id: hgps-vivo
    title: "Progeria in vivo methylome"
    kind: thesis
    years: "2022–"
    summary: "Multi-tissue DNA methylation in a knock-in Lmna G609G progeria mouse."
    detail: |
      Array (MM285) and whole-genome bisulfite profiling across tissues of a
      CRISPR knock-in Lmna c.1827C>T mouse, integrated with RNA-seq, proteomics
      and spatial transcriptomics. Progeria remodels the liver methylome at
      enhancers while the aorta stays largely unchanged. First-author manuscript in
      preparation.
    tags: [MM285, WGBS, RNA-seq, proteomics, spatial]

  - id: hgps-vitro
    title: "Progerin and the 3D genome"
    kind: thesis
    years: "2022–"
    summary: "Inducible progerin fibroblasts plus ~30 published HGPS datasets, integrated into one disease cascade."
    detail: |
      An inducible GFP-progerin fibroblast model profiled by Hi-C, CUT&Tag,
      ATAC-seq, WGBS and EPIC arrays, alongside a uniform reprocessing of
      published HGPS chromatin, methylation, transcriptome and proteome data.
      Goal: order the events from nuclear-lamina defects to chromatin
      reorganisation to transcriptional senescence.
    tags: [Hi-C, CUT&Tag, ATAC-seq, EPIC, nf-core]

  - id: hgps-silico
    title: "Lamin A vs progerin interactome"
    kind: thesis
    years: "2025–"
    summary: "Proteome-scale AlphaFold3 screen for interactions progerin loses, keeps or gains."
    detail: |
      Thousands of AlphaFold3 / Chai-1 / Boltz-2 predictions of lamin A and
      progerin against candidate nuclear partners, scored at the interface
      (ipTM, ipSAE, iLIS). These link structural changes to the chromatin
      phenotypes measured in the in vitro and in vivo arms.
    tags: [AlphaFold3, Chai-1, Boltz-2, GPU/HPC]

  - id: serial-culture
    title: "Replicative aging methylome"
    kind: thesis
    years: "2023–"
    summary: "Primary cells serially cultured to senescence: coordinated drift or clonal takeover?"
    detail: |
      Longitudinal 5mC/5hmC profiling of primary cells passaged to replicative
      senescence, testing whether age-associated methylation change comes from
      coordinated drift across cells or from clonal expansion, and how vitamin C
      perturbs it.
    tags: [EPIC, 5hmC, single-cell methylation]

  - id: dl-clocks
    title: "Interpretable deep-learning clocks"
    kind: side
    years: "2024–"
    summary: "MLP and graph neural network epigenetic clocks in R {torch}, explained with SHAP."
    detail: |
      Epigenetic-age models that go beyond penalised regression: multilayer
      perceptrons and graph neural networks (GCN, GraphSAGE, PNA) trained in
      R {torch}, with SHAP attributions to recover mechanistic signal. Presented
      at BioC2025 and adapted into an Open Case Study.
    tags: [torch, GNN, SHAP, R]
    links:
      - { label: "repo", url: "https://github.com/BacZemin/Bioc2025_torch_clock" }

  - id: bread
    title: "BREAD"
    kind: software
    years: "2026"
    summary: "Bayesian Region-level Estimation of Altered DNA methylation: posterior probabilities instead of p-values, including an explicit 'unchanged' call."
    detail: |
      An R package for region-specific differential methylation that reports
      posterior probabilities of change, with the effect size and uncertainty, and
      can positively conclude that a region did *not* change.
    tags: [R, Bayesian, Stan, Bioconductor-style]
    links:
      - { label: "docs", url: "https://baczemin.github.io/BREAD/" }
      - { label: "repo", url: "https://github.com/BacZemin/BREAD" }

  - id: mead
    title: "MEAD"
    kind: software
    years: "2025"
    summary: "Mouse Epigenetic Age Determination: a pan-tissue clock for MM285 arrays."
    tags: [R, epigenetic clock, MM285]
    links:
      - { label: "repo", url: "https://github.com/BacZemin/MEAD" }

  - id: nano2qubit
    title: "nano2Qubit"
    kind: software
    years: "2025"
    summary: "Predicts Qubit dsDNA concentration from cheaper Nanodrop readings."
    tags: [R, lab utility]
    links:
      - { label: "repo", url: "https://github.com/BacZemin/nano2Qubit" }

